kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Name your cluster directly in the config (optional)
name: normal-cluster
nodes:
  # The control-plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Forward local laptop ports (80/443) into the cluster (useful for Ingress)
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
