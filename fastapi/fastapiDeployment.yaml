# fastapi/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  namespace: ai-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-api

  template:
    metadata:
      labels:
        app: ai-api

    spec:
      containers:
        - name: ai-api

          image: ai-fastapi:1.3.6

          imagePullPolicy: IfNotPresent

          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api
                  key: GEMINI_API_KEY

            - name: GEMINI_MODEL
              value: gemini-2.5-flash

            - name: POSTGRES_HOST
              value: ai-postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ai-postgres-secret
                  key: POSTGRES_DB

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: ai-platform

spec:
  selector:
    app: ai-api

  ports:
    - port: 8000
      targetPort: 8000