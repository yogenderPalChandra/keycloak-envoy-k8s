
apiVersion: v1
kind: Secret
metadata:
  name: ai-postgres-secret
  namespace: ai-platform
type: Opaque
stringData:
  POSTGRES_USER: yogi
  POSTGRES_PASSWORD: yogi
  POSTGRES_DB: episodic_memory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-postgres-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-postgres
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-postgres
  template:
    metadata:
      labels:
        app: ai-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: ai-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: ai-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ai-postgres
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app: ai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
