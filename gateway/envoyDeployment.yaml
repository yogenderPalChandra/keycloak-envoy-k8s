
---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: ai-platform
  annotations:
    gateway.envoyproxy.io/service-type: NodePort

spec:
  gatewayClassName: eg

  listeners:
    - name: http
      protocol: HTTP
      port: 80

      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-api
  namespace: ai-platform

spec:
  parentRefs:
    - name: ai-gateway

  rules:

    - matches:
        - path:
            type: PathPrefix
            value: /api/health
      backendRefs:
        - name: ai-api
          port: 8000

    - matches:
        - path:
            type: Exact
            value: /api/chat
      backendRefs:
        - name: ai-api
          port: 8000

    - matches:
        - path:
            type: Exact
            value: /api/admin/overview
      backendRefs:
        - name: ai-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /api/db-health
      backendRefs:
        - name: ai-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /api/whoami
      backendRefs:
        - name: ai-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/conversations
      backendRefs:
        - name: ai-api
          port: 8000