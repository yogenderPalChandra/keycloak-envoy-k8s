apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: custom-proxy-config
  namespace: envoy-gateway-system # <--- Must live alongside the engine [1]
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort # <--- Forces NodePort instead of LoadBalancer [1]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # This section tells the GatewayClass to read the EnvoyProxy template above [1]
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: custom-proxy-config
    namespace: envoy-gateway-system
